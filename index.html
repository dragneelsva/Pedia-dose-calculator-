<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Shivankar's Dose Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #F5F7F6;
            --surface: #FFFFFF;
            --ink: #142420;
            --ink-soft: #5B6B67;
            --teal: #0F6E6A;
            --teal-deep: #0B4F4C;
            --teal-tint: rgba(15, 110, 106, 0.09);
            --amber: #E2A33B;
            --amber-deep: #C68621;
            --coral: #C1443C;
            --coral-tint: #FBEEEC;
            --line: #DCE4E1;
            --card-radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--paper);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border-radius: var(--card-radius);
            box-shadow: 0 1px 2px rgba(20,36,32,0.04), 0 10px 30px rgba(20,36,32,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            padding: 22px 24px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--line);
            position: relative;
        }

        header::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: -1px;
            height: 2px;
            background: linear-gradient(90deg, var(--teal), var(--amber) 60%, transparent);
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--teal-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-icon i {
            font-size: 1.1rem;
            color: var(--teal);
        }

        .header-text .eyebrow {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 0 0 2px;
        }

        header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.15rem;
            margin: 0;
            color: var(--ink);
            font-weight: 600;
        }

        /* Input Section */
        .input-section {
            padding: 26px 24px 22px;
            background: var(--surface);
        }

        .input-section h2 {
            margin: 0 0 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--ink);
        }

        .input-section p {
            color: var(--ink-soft);
            font-size: 0.92rem;
            margin: 0 0 22px;
            line-height: 1.4;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background-color: #FBFCFC;
            transition: border-color 0.2s, box-shadow 0.2s;
            padding: 0 14px;
        }

        .input-wrapper:focus-within {
            border-color: var(--teal);
            box-shadow: 0 0 0 4px var(--teal-tint);
            background-color: #fff;
        }

        .input-wrapper i {
            color: var(--ink-soft);
            font-size: 0.95rem;
        }

        .input-wrapper input {
            flex: 1;
            width: 100%;
            padding: 15px 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.25rem;
            font-variant-numeric: tabular-nums;
            border: none;
            background: transparent;
            outline: none;
            color: var(--ink);
        }

        .input-wrapper input::placeholder {
            color: #A8B5B1;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .input-unit {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.85rem;
            color: var(--ink-soft);
            padding-left: 6px;
        }

        .calculate-btn {
            width: 100%;
            padding: 16px;
            margin-top: 22px;
            background: var(--amber);
            border: none;
            border-radius: 10px;
            color: #2B1A02;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 16px rgba(226, 163, 59, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .calculate-btn:hover { background: var(--amber-deep); }
        .calculate-btn:active { transform: scale(0.97); }
        .calculate-btn:focus-visible {
            outline: 2px solid var(--teal-deep);
            outline-offset: 3px;
        }
        .calculate-btn:disabled {
            opacity: 0.85;
            cursor: default;
        }

        .btn-dots span {
            display: inline-block;
            opacity: 0.3;
            animation: dotPulse 1s infinite;
        }
        .btn-dots span:nth-child(2) { animation-delay: 0.15s; }
        .btn-dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dotPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 1; }
        }

        /* Results Section */
        #results-area {
            background-color: var(--paper);
            border-top: 1px solid var(--line);
            display: none;
            padding-bottom: 36px;
        }

        .category-card {
            background: var(--surface);
            margin: 14px 15px;
            border-radius: var(--card-radius);
            box-shadow: 0 1px 2px rgba(20,36,32,0.05);
            border: 1px solid var(--line);
            overflow: hidden;
            opacity: 0;
            transform: translateY(14px);
            animation: cardReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .category-header {
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: var(--surface);
            transition: background 0.2s;
        }

        .category-header:hover { background: #FAFBFB; }
        .category-header:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: -2px;
        }

        .category-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.02rem;
        }

        .icon-chip {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: var(--teal-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-chip i {
            color: var(--teal);
            font-size: 0.85rem;
        }

        .category-content {
            padding: 4px 18px 18px;
            border-top: 1px solid #F0F3F2;
            display: block;
        }

        /* Medication Item Styles */
        .med-item {
            margin-top: 20px;
        }

        .med-name {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .med-dose {
            font-family: 'IBM Plex Mono', monospace;
            font-variant-numeric: tabular-nums;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--ink);
            margin: 4px 0 10px;
        }

        .frac-meter {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            max-width: 160px;
        }

        .frac-segment {
            flex: 1;
            height: 7px;
            border-radius: 3px;
            background: var(--line);
        }

        .frac-segment.filled {
            background: var(--teal);
        }

        .dose-note {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--ink-soft);
            margin-left: 4px;
        }

        .chart-toggle {
            margin-top: 8px;
            margin-bottom: 4px;
            background: none;
            border: none;
            padding: 0;
            color: var(--teal);
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chart-toggle:hover { color: var(--teal-deep); }
        .chart-toggle:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        .dose-chart {
            margin-top: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            animation: chartReveal 0.22s ease;
        }

        @keyframes chartReveal {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: none; }
        }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem;
        }

        .chart-table th {
            text-align: left;
            background: #FAFBFB;
            color: var(--ink-soft);
            padding: 8px 10px;
            font-weight: 600;
            border-bottom: 1px solid var(--line);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.66rem;
            font-family: 'Inter', sans-serif;
        }

        .chart-table td {
            padding: 7px 10px;
            border-bottom: 1px solid #F0F3F2;
            color: var(--ink);
        }

        .chart-table tr:last-child td { border-bottom: none; }

        .chart-table tr.active-row td {
            background: var(--teal-tint);
            color: var(--teal-deep);
            font-weight: 600;
        }

        .rationale-box {
            background-color: #FAFBFB;
            border: 1px solid #EEF2F1;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .rationale-title {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rationale-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: #4A5754;
        }

        .deviation-warning {
            margin-top: 8px;
            padding: 10px 12px;
            background-color: var(--coral-tint);
            border-left: 3px solid var(--coral);
            border-radius: 6px;
            color: var(--coral);
            font-size: 0.82rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 7px;
            animation: warnFlash 1.6s ease-out 1;
        }

        @keyframes warnFlash {
            0% { background-color: #F6D8D5; }
            100% { background-color: var(--coral-tint); }
        }

        /* Accordion Logic */
        .toggle-icon {
            transition: transform 0.3s ease;
            color: var(--ink-soft);
            font-size: 0.85rem;
        }

        .category-header:not(.collapsed) .toggle-icon {
            transform: rotate(180deg);
        }

        .collapsed + .category-content {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .category-card, .deviation-warning, .btn-dots span {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-icon"><i class="fa-solid fa-stethoscope"></i></div>
        <div class="header-text">
            <p class="eyebrow">Clinical Tools</p>
            <h1>Dr. Shivankar's</h1>
        </div>
    </header>

    <div class="input-section">
        <h2>Dose Calculator</h2>
        <p>Enter patient weight to calculate all pediatric doses.</p>

        <div class="input-group">
            <label>Patient Weight</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-weight-scale"></i>
                <input type="number" id="weightInput" placeholder="e.g., 12.5" step="0.1" inputmode="decimal">
                <span class="input-unit">kg</span>
            </div>
        </div>

        <button class="calculate-btn" id="calcBtn" onclick="calculateDoses()">
            <span id="calcBtnLabel">Calculate All Doses</span>
        </button>
    </div>

    <div id="results-area">
        </div>
</div>

<script>
    const DEVIATION_WARNING_THRESHOLD = 20;

    const COLD_SYRUP_BANDS = [
        { label: "3 – <4 kg", dose: "4 drops", test: w => w >= 3 && w < 4 },
        { label: "4 – <5 kg", dose: "5 drops", test: w => w >= 4 && w < 5 },
        { label: "5 – <6 kg", dose: "6 drops", test: w => w >= 5 && w < 6 },
        { label: "6 – 8 kg", dose: "0.4 ml", test: w => w >= 6 && w <= 8 },
        { label: ">8 – 11 kg", dose: "2.5 ml", test: w => w > 8 && w <= 11 },
        { label: ">11 – 13 kg", dose: "3.0 ml", test: w => w > 11 && w <= 13 },
        { label: ">13 – 16 kg", dose: "3.5 ml", test: w => w > 13 && w <= 16 },
        { label: ">16 – 19 kg", dose: "4.0 ml", test: w => w > 16 && w <= 19 },
        { label: "20+ kg", dose: "5.0 ml", test: w => w >= 20 }
    ];

    const COUGH_SYRUP_BANDS = [
        { label: "<9 kg", dose: "Not Recommended (<9kg)", test: w => w < 9 },
        { label: "9 – 12 kg", dose: "2.5 ml", test: w => w >= 9 && w <= 12 },
        { label: ">12 – 15 kg", dose: "3.0 ml", test: w => w > 12 && w <= 15 },
        { label: ">15 – 17 kg", dose: "3.5 ml", test: w => w > 15 && w <= 17 },
        { label: "18+ kg", dose: "4.0 ml", test: w => w >= 18 }
    ];

    function getBandDose(weight, bands) {
        const match = bands.find(b => b.test(weight));
        return match ? match.dose : "N/A";
    }

    function formatNum(num) {
        if (isNaN(num)) return "N/A";
        return Math.round(num * 100) / 100;
    }

    function getBestParacetamolTablet(targetMg) {
        const options = [
            { label: "1/4", val: 0.25, size: 500 },
            { label: "1/3", val: 0.3333, size: 500 },
            { label: "1/2", val: 0.5, size: 500 },
            { label: "1", val: 1.0, size: 500 },
            { label: "1/2", val: 0.5, size: 650 },
            { label: "1", val: 1.0, size: 650 }
        ];

        let bestOption = options[0];
        let minDiff = Math.abs(targetMg - (options[0].val * options[0].size));

        options.forEach(opt => {
            let currentDose = opt.val * opt.size;
            let diff = Math.abs(targetMg - currentDose);
            if (diff < minDiff) {
                minDiff = diff;
                bestOption = opt;
            }
        });

        const deliveredMg = bestOption.val * bestOption.size;
        const deviationPct = targetMg > 0 ? Math.abs((deliveredMg - targetMg) / targetMg) * 100 : 0;

        return {
            text: `${bestOption.label} of ${bestOption.size}mg tablet`,
            fractionLabel: bestOption.label,
            deliveredMg: deliveredMg,
            targetMg: targetMg,
            deviationPct: deviationPct
        };
    }

    function getGenericTabletSuggestion(targetMg, tabletSize) {
        const fractions = [
            { label: "1/4", val: 0.25 },
            { label: "1/2", val: 0.5 },
            { label: "3/4", val: 0.75 },
            { label: "1", val: 1.0 }
        ];

        let bestFraction = fractions[0];
        let minDiff = Math.abs(targetMg - (fractions[0].val * tabletSize));

        fractions.forEach(frac => {
            let diff = Math.abs(targetMg - (frac.val * tabletSize));
            if (diff < minDiff) {
                minDiff = diff;
                bestFraction = frac;
            }
        });

        const deliveredMg = bestFraction.val * tabletSize;
        const deviationPct = targetMg > 0 ? Math.abs((deliveredMg - targetMg) / targetMg) * 100 : 0;

        return {
            text: `${bestFraction.label} of ${tabletSize}mg tablet`,
            fractionLabel: bestFraction.label,
            deliveredMg: deliveredMg,
            targetMg: targetMg,
            deviationPct: deviationPct
        };
    }

    function parseFraction(label) {
        if (label === "1") return { num: 1, den: 1 };
        const parts = label.split('/');
        return { num: parseInt(parts[0], 10), den: parseInt(parts[1], 10) };
    }

    function buildFractionMeter(label) {
        const { num, den } = parseFraction(label);
        let segs = "";
        for (let i = 0; i < den; i++) {
            segs += `<div class="frac-segment ${i < num ? 'filled' : ''}"></div>`;
        }
        return `<div class="frac-meter" aria-hidden="true">${segs}</div>`;
    }

    function roundToNearest50(mg) {
        return Math.round(mg / 50) * 50;
    }

    function buildRangeDoseHtml(name, lowerMg, upperMg, formulaLower, formulaUpper) {
        const middleMg = roundToNearest50((lowerMg + upperMg) / 2);
        return `
            <div class="med-item">
                <div class="med-name"><i class="fa-solid fa-flask"></i> ${name}</div>
                <div class="med-dose">${formatNum(lowerMg)} – ${formatNum(upperMg)} mg <span class="dose-note">(≈ ${middleMg} mg ideal)</span></div>
                <div class="rationale-box">
                    <div class="rationale-title"><i class="fa-solid fa-circle-info"></i> Rationale</div>
                    <div class="rationale-text">Lower: ${formulaLower} · Upper: ${formulaUpper}</div>
                </div>
            </div>
        `;
    }

    function buildChartItemHtml(name, doseText, bands, weight, idSuffix) {
        const chartId = `chart-${idSuffix}`;
        const rowsHtml = bands.map(b => {
            const isActive = b.test(weight);
            return `<tr class="${isActive ? 'active-row' : ''}"><td>${b.label}</td><td>${b.dose}</td></tr>`;
        }).join('');

        return `
            <div class="med-item">
                <div class="med-name"><i class="fa-solid fa-flask"></i> ${name}</div>
                <div class="med-dose">${doseText}</div>
                <button type="button" class="chart-toggle" onclick="toggleChart('${chartId}', this)" aria-expanded="false" aria-controls="${chartId}">
                    <i class="fa-solid fa-table-list"></i> View dosing chart
                </button>
                <div class="dose-chart" id="${chartId}" style="display:none;">
                    <table class="chart-table">
                        <thead><tr><th>Weight</th><th>Dose</th></tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            </div>
        `;
    }

    function buildTabletDoseHtml(name, result) {
        const deviationRounded = formatNum(result.deviationPct);
        let warningHtml = "";
        if (result.deviationPct > DEVIATION_WARNING_THRESHOLD) {
            warningHtml = `
                <div class="deviation-warning">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    ${deviationRounded}% off target dose — verify before dispensing
                </div>
            `;
        }
        return `
            <div class="med-item">
                <div class="med-name"><i class="fa-solid fa-flask"></i> ${name}</div>
                <div class="med-dose">${result.text}</div>
                ${buildFractionMeter(result.fractionLabel)}
                <div class="rationale-box">
                    <div class="rationale-title"><i class="fa-solid fa-circle-info"></i> Rationale</div>
                    <div class="rationale-text">Delivers ${formatNum(result.deliveredMg)}mg vs target ${formatNum(result.targetMg)}mg</div>
                </div>
                ${warningHtml}
            </div>
        `;
    }

    function runCalculation() {
        const weight = parseFloat(document.getElementById('weightInput').value);
        const resultsArea = document.getElementById('results-area');

        const coldSyrupDose = getBandDose(weight, COLD_SYRUP_BANDS);
        const coughSyrupDose = getBandDose(weight, COUGH_SYRUP_BANDS);

        const paraTarget = 15 * weight;
        const bestParaTablet = getBestParacetamolTablet(paraTarget);

        const emesetMg = 0.1 * weight;
        const emesetTabResult = getGenericTabletSuggestion(emesetMg, 4);

        const categories = [
            {
                title: "Paracetamol",
                icon: "fa-capsules",
                items: [
                    { name: "Drops (ml)", dose: formatNum((15 * weight) / 100) + " ml", formula: "(15 * weight) / 100" },
                    { name: "Dolo 120 (ml)", dose: formatNum((15 * 5 * weight) / 120) + " ml", formula: "(15 * 5 * weight) / 120" },
                    { name: "Dolo 250 (ml)", dose: formatNum((15 * 5 * weight) / 250) + " ml", formula: "(15 * 5 * weight) / 250" },
                    { name: "Fepanil 500 (ml)", dose: formatNum((15 * 5 * weight) / 500) + " ml", formula: "(15 * 5 * weight) / 500" }
                ],
                tabletItems: [{ name: "Tablet Suggestion", result: bestParaTablet }]
            },
            {
                title: "Cold & Cough Syrup",
                icon: "fa-snowflake",
                items: [
                    { name: "Syrup Phenergan", dose: formatNum((0.3 * 5 * weight) / 5) + " ml", formula: "(0.3 * 5 * weight) / 5" }
                ],
                chartItems: [
                    { name: "Cold Syrup", dose: coldSyrupDose, bands: COLD_SYRUP_BANDS },
                    { name: "Cough Syrup", dose: coughSyrupDose, bands: COUGH_SYRUP_BANDS }
                ]
            },
            {
                title: "Fepanil-M",
                icon: "fa-prescription-bottle-medical",
                items: [
                    { name: "Fepanil-M 50mg (ml)", dose: formatNum((13 * weight * 5) / 120) + " ml", formula: "(13 * weight * 5) / 120" },
                    { name: "Fepanil-M 100mg (ml)", dose: formatNum((13 * weight * 5) / 250) + " ml", formula: "(13 * weight * 5) / 250" }
                ]
            },
            {
                title: "Amoxyclav",
                icon: "fa-bacteria",
                items: [
                    { name: "Megacv 80mg drops (ml)", dose: formatNum(((20 * weight) / 80) / 3) + " ml", formula: "(((20 * weight) / 80) / 3)" },
                    { name: "Fightox 228mg (ml)", dose: formatNum((15 * 5 * weight) / 228) + " ml", formula: "(15 * 5 * weight) / 228" },
                    { name: "Augmentin 457mg (ml)", dose: formatNum((15 * 5 * weight) / 400) + " ml", formula: "(15 * 5 * weight) / 400" }
                ]
            },
            {
                title: "Azithromycin",
                icon: "fa-tablets",
                items: [
                    { name: "Azithral 100mg (ml)", dose: formatNum((10 * 5 * weight) / 100) + " ml", formula: "(10 * 5 * weight) / 100" },
                    { name: "Azithral 200mg (ml)", dose: formatNum((10 * 5 * weight) / 200) + " ml", formula: "(10 * 5 * weight) / 200" }
                ]
            },
            {
                title: "Vomiting",
                icon: "fa-face-dizzy",
                items: [
                    { name: "Drops Domstal Baby (ml)", dose: formatNum((0.4 * weight) / 10) + " ml", formula: "(0.4 * weight) / 10" },
                    { name: "Syrup Emeset (ml)", dose: formatNum((0.1 * 5 * weight) / 2) + " ml", formula: "(0.1 * 5 * weight) / 2" },
                    { name: "Syrup Domstal (ml)", dose: formatNum((0.3 * 5 * weight) / 5) + " ml", formula: "(0.3 * 5 * weight) / 5" }
                ],
                tabletItems: [{ name: "Tablet Emeset (4mg)", result: emesetTabResult }]
            },
            {
                title: "Cefixime",
                icon: "fa-vial",
                items: [
                    { name: "Syrup Cefi 50mg (ml)", dose: formatNum((25 * weight) / 50) + " ml", formula: "(25 * weight) / 50" },
                    { name: "Syrup Ziprox 100mg (ml)", dose: formatNum((25 * weight) / 100) + " ml", formula: "(25 * weight) / 100" },
                    { name: "Drops Monocef (25mg/1ml)", dose: formatNum((5 * weight) / 25) + " ml", formula: "(5 * weight) / 25" }
                ]
            },
            {
                title: "Ceftriaxone (IV)",
                icon: "fa-syringe",
                rangeItems: [
                    {
                        name: "Ceftriaxone Dose Range",
                        lowerMg: (50 * weight) / 2,
                        upperMg: (100 * weight) / 2,
                        formulaLower: "(50 * weight) / 2",
                        formulaUpper: "(100 * weight) / 2"
                    }
                ]
            },
            {
                title: "Hicope",
                icon: "fa-droplet",
                items: [
                    { name: "Formulation 10 (ml)", dose: formatNum((0.5 * 5 * weight) / 10) + " ml", formula: "(0.5 * 5 * weight) / 10" }
                ]
            },
            {
                title: "Metronidazole",
                icon: "fa-bug",
                items: [
                    { name: "Syrup Metrogyl 200mg (ml)", dose: formatNum((10 * 5 * weight) / 200) + " ml", formula: "(10 * 5 * weight) / 200" }
                ]
            },
            {
                title: "Ranitidine",
                icon: "fa-fire",
                items: [
                    { name: "Syrup Ranor (ml)", dose: formatNum((3 * 5 * weight) / 75) + " ml", formula: "(3 * 5 * weight) / 75" }
                ]
            },
            {
                title: "Acyclovir",
                icon: "fa-virus",
                items: [
                    { name: "Syrup Acyclovir (400mg/5ml)", dose: formatNum((20 * 5 * weight) / 400) + " ml", formula: "(20 * 5 * weight) / 400" }
                ]
            }
        ];

        resultsArea.innerHTML = "";
        resultsArea.style.display = "block";

        categories.forEach((cat, index) => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.style.animationDelay = (index * 55) + "ms";

            let itemsHtml = "";
            (cat.items || []).forEach(item => {
                itemsHtml += `
                    <div class="med-item">
                        <div class="med-name"><i class="fa-solid fa-flask"></i> ${item.name}</div>
                        <div class="med-dose">${item.dose}</div>
                        <div class="rationale-box">
                            <div class="rationale-title"><i class="fa-solid fa-circle-info"></i> Rationale</div>
                            <div class="rationale-text">${item.formula}</div>
                        </div>
                    </div>
                `;
            });

            (cat.tabletItems || []).forEach(item => {
                itemsHtml += buildTabletDoseHtml(item.name, item.result);
            });

            (cat.rangeItems || []).forEach(item => {
                itemsHtml += buildRangeDoseHtml(item.name, item.lowerMg, item.upperMg, item.formulaLower, item.formulaUpper);
            });

            (cat.chartItems || []).forEach((item, itemIndex) => {
                itemsHtml += buildChartItemHtml(item.name, item.dose, item.bands, weight, `${index}-${itemIndex}`);
            });

            card.innerHTML = `
                <div class="category-header collapsed" onclick="toggleCategory(this)" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCategory(this);}">
                    <div class="category-title">
                        <div class="icon-chip"><i class="fa-solid ${cat.icon}"></i></div>
                        ${cat.title}
                    </div>
                    <i class="fa-solid fa-chevron-down toggle-icon"></i>
                </div>
                <div class="category-content">
                    ${itemsHtml}
                </div>
            `;
            resultsArea.appendChild(card);
        });

        resultsArea.scrollIntoView({ behavior: 'smooth' });
    }

    function calculateDoses() {
        const weight = parseFloat(document.getElementById('weightInput').value);
        if (!weight || weight <= 0) {
            alert("Please enter a valid weight in kg.");
            return;
        }

        const btn = document.getElementById('calcBtn');
        const label = document.getElementById('calcBtnLabel');
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (reduceMotion) {
            runCalculation();
            return;
        }

        btn.disabled = true;
        label.innerHTML = 'Measuring<span class="btn-dots"><span>.</span><span>.</span><span>.</span></span>';

        setTimeout(() => {
            runCalculation();
            btn.disabled = false;
            label.textContent = "Calculate All Doses";
        }, 380);
    }

    window.toggleChart = function(id, btn) {
        const el = document.getElementById(id);
        const isOpen = el.style.display !== 'none';
        el.style.display = isOpen ? 'none' : 'block';
        btn.classList.toggle('open', !isOpen);
        btn.setAttribute('aria-expanded', String(!isOpen));
    }

    window.toggleCategory = function(header) {
        header.classList.toggle('collapsed');
    }
</script>

</body>
</html>
